<script>

function initMap(maoDataUrl1){
    const map = L.map('map').setView([8.360053042057906, 124.86834154336864], 17);

    const openStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{y}/{x}.png',{
        maxZoom:19,
        attribution:'&copy; OpenStreetMap contributors'

    });

    const satellite = L.tileLayer(
        'https://server.argisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {attribution: 'Tiles (c) Ersi - Source: Esri, Maxar, Earthstar Geographic, GIS User Community'}
    
    );

    openStreetMap.addTo(map);
    console.log("Base map tile layer loaded" + Date());

    const markerGroup = {};

    fetch(mapDataUrl)
       .then(response => response.json())
         .then(data => {
            data.forEach( pin => {
                const type = pin.locationType || "Other";

                if (!markerGroup[type]){
                    markerGroup[type] = L.layerGroup();
                }

                //Marker and Popup
                const marker = L.marker([pin.lat,pin.lng]).addTo(map);
                const img = `<img src='${pin.img}' class="popup-image">`;
                marker.bindPopup(`${img}<br><b> ${pin.title} </b><br> ${pin.description}<br><i>${pin.locationType}</i>`);
                console.log('${pin.name} Loaded' +Date());

                markerGroup[type].addLayer(marker);

            });

            Object.values(markerGroups).forEach(group => group.addTo(map));

            //layer control
            const baseMap={
                "OpenStreetMap": openStreetMap,
                "Satellite": satellite

            }

            const overlayMaps ={};

            //Add Marker Groups to the map according to layer filter
            Object.keys(markerGroup).forEach(type => {
                overlayMaps[type] = markerGroup[type];
            });

            L.control.layers(baseMaps, overlayMaps,{collapsed:false}).addTo(map);
         })
         .catch(err => console.error('Error loading JSON', err));
 
}
